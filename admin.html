<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゲーム管理画面</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f3e9;color:#3d342b;font-family:system-ui,sans-serif}
main{max-width:520px;margin:auto;padding:20px}h1{font-size:23px}section{background:white;padding:16px;border-radius:16px;margin:14px 0}
input{width:100%;padding:12px;border:1px solid #cfc4b5;border-radius:10px;margin:6px 0 12px;font-size:16px}
button{background:#5d8b57;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{background:#f6f0e7;padding:10px;border-radius:12px}.item img{width:76px;height:76px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 6px}.item input{font-size:12px;padding:7px}
small{color:#766b5f}#app{display:none}#msg{white-space:pre-wrap;font-size:14px}
</style></head><body><main>
<h1>🔐 ゲーム管理画面</h1><p>管理者だけがログインして、公開ゲームの画像やタイトルを変更できます。</p>
<section id="login"><h2>管理者ログイン</h2><label>メールアドレス</label><input id="email" type="email" autocomplete="username"><label>パスワード</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">ログイン</button> <small>アカウントはSupabaseの管理画面で事前に作成してください。</small></section>
<section id="app"><h2>公開内容の編集</h2><label>ゲームタイトル</label><input id="gameTitle" maxlength="40"><div class="grid" id="levels"></div><p><button id="save">変更を公開URLに反映</button> <button id="logout" style="background:#887b6c">ログアウト</button></p></section>
<p id="msg"></p>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
(async()=>{
const msg=document.getElementById('msg'),login=document.getElementById('login'),app=document.getElementById('app');
if(!window.APP_CONFIG?.SUPABASE_URL||!APP_CONFIG?.SUPABASE_ANON_KEY){msg.textContent='config.jsを設定してください。';return;}
const sb=window.supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_ANON_KEY);
const names=['レベル1','レベル2','レベル3','レベル4','レベル5','レベル6','レベル7','スイカ'],emoji=['🍒','🍓','🍇','🍊','🍎','🍐','🍈','🍉'];
let urls=Array(8).fill(null);
const levels=document.getElementById('levels');
names.forEach((name,i)=>{let d=document.createElement('div');d.className='item';let im=document.createElement('img');im.id='p'+i;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" rx="50" fill="white"/><text x="50" y="68" font-size="62" text-anchor="middle">${emoji[i]}</text></svg>`);let l=document.createElement('div');l.textContent=name;let f=document.createElement('input');f.type='file';f.accept='image/*';f.addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;let local=URL.createObjectURL(file);im.src=local;im.dataset.fileName=file.name;im._file=file;});d.append(im,l,f);levels.append(d);});
async function show(){let {data,error}=await sb.from('game_config').select('*').eq('id',1).single();if(error){msg.textContent='設定の読み込みに失敗：'+error.message;return;}document.getElementById('gameTitle').value=data.title||'マイ・スイカゲーム';urls=(data.images||[]).slice();while(urls.length<8)urls.push(null);urls.forEach((u,i)=>{if(u)document.getElementById('p'+i).src=u;});login.style.display='none';app.style.display='block';msg.textContent='ログイン中。変更したら「変更を公開URLに反映」を押してね。';}
document.getElementById('loginBtn').onclick=async()=>{msg.textContent='ログイン中…';let {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){msg.textContent='ログインできません：'+error.message;return;}await show();};
document.getElementById('save').onclick=async()=>{msg.textContent='保存中…';let user=(await sb.auth.getUser()).data.user;if(!user){msg.textContent='ログインし直してください。';return;}
 for(let i=0;i<8;i++){let f=document.getElementById('p'+i)._file;if(f){let ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');let path=`${i}-${Date.now()}.${ext}`;let {error}=await sb.storage.from('game-images').upload(path,f,{upsert:true,contentType:f.type||'image/jpeg'});if(error){msg.textContent='画像アップロード失敗：'+error.message;return;}urls[i]=sb.storage.from('game-images').getPublicUrl(path).data.publicUrl;}}
 let {error}=await sb.from('game_config').upsert({id:1,title:document.getElementById('gameTitle').value||'マイ・スイカゲーム',images:urls,updated_at:new Date().toISOString()});if(error){msg.textContent='保存失敗：'+error.message;return;}
 msg.textContent='保存できたよ！公開ゲームを再読み込みすると最新版が表示されます。';
};
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();app.style.display='none';login.style.display='block';msg.textContent='ログアウトしました。';};
const {data:{session}}=await sb.auth.getSession();if(session)await show();
})();
</script></body></html>
